# Requires the pinned private Hyprlock video build, not /usr/bin/hyprlock.
source = ~/.config/hypr/hyprlock-layout.conf

background {
    monitor =
    path = ~/Pictures/Wallpapers/Golden_Dark_60fps.mov
    color = rgb(1e1e2e)
    blur_passes = 0
    noise = 0
    brightness = 1
    contrast = 1
    video_loop = true
    video_mute = true
    # Software decoding was smooth in the dual-monitor test; auto-safe selected
    # vulkan-copy and showed sustained frame drops on this machine.
    video_hwdec = no
    # 0 removes the rendering cap; each output is limited by its refresh rate.
    video_fps_cap = 0
}
