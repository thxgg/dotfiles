# Stock Hyprlock recovery path. Missing image still gives an opaque background.
source = ~/.config/hypr/hyprlock-layout.conf

background {
    monitor =
    path = ~/Pictures/Wallpapers/Golden_Dark_MOV_still.png
    color = rgb(0d1117)
    blur_passes = 0
    noise = 0
    brightness = 1
    contrast = 1
}
