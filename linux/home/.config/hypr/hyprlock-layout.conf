# Shared by the video build and the stock static recovery configuration.
# No transparent background, password-free grace, screenshot, or unlock command.
general {
    hide_cursor = false
    ignore_empty_input = true
    immediate_render = true
}

auth {
    pam {
        enabled = true
        module = hyprlock
    }
    fingerprint {
        enabled = false
    }
}

animations {
    enabled = false
}

label {
    monitor = DP-3
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(e6edf3)
    font_family = SF Pro Display
    font_size = 24
    position = 0, -9%
    halign = center
    valign = top
}

label {
    monitor = DP-3
    text = $TIME
    color = rgb(e6edf3)
    font_family = SF Pro Display
    font_size = 100
    position = 0, -13%
    halign = center
    valign = top
}

image {
    monitor = DP-3
    path = ~/Pictures/avatar.png
    size = 80
    rounding = -1
    border_size = 2
    border_color = rgb(2f81f7)
    position = 0, 24%
    halign = center
    valign = bottom
}

label {
    monitor = DP-3
    text = $USER
    color = rgb(e6edf3)
    font_family = SF Pro Display
    font_size = 22
    position = 0, 20%
    halign = center
    valign = bottom
}

input-field {
    monitor = DP-3
    size = 300, 52
    position = 0, 13%
    halign = center
    valign = bottom
    rounding = 26
    outline_thickness = 2
    outer_color = rgb(2f81f7)
    inner_color = rgba(0d1117dd)
    font_color = rgb(e6edf3)
    check_color = rgb(3fb950)
    fail_color = rgb(ff7b72)
    font_family = SF Pro Display
    placeholder_text = Enter password
    fail_text = $PAMFAIL
    fade_on_empty = false
    dots_center = true
}

label {
    monitor = DP-3
    text = $LAYOUT
    onclick = ~/.config/hypr/scripts/switch-keyboard-layout.sh
    color = rgb(82878c)
    font_family = SF Pro Display
    font_size = 14
    position = 0, 7%
    halign = center
    valign = bottom
}
