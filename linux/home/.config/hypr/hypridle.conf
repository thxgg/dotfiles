# Started only after explicit session-control.py enable-idle.
general {
    lock_cmd = python3 ~/.config/hypr/scripts/session-control.py lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = python3 ~/.config/hypr/scripts/session-control.py display-on
    inhibit_sleep = 3
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
}

listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1800
    on-timeout = python3 ~/.config/hypr/scripts/session-control.py display-off
    on-resume = python3 ~/.config/hypr/scripts/session-control.py display-on
}

# Deliberately no automatic suspend, dimming, or unlock command.
