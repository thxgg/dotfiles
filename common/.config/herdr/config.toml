# Herdr configuration
# Managed in ~/.dotfiles and stowed to ~/.config/herdr/config.toml

onboarding = false

[terminal]
# Use fish while preserving macOS login shell behavior.
default_shell = "fish"
shell_mode = "auto"
# Open new panes and tabs in the current pane's directory.
new_cwd = "follow"

# Merino uses terminal as the fallback, with explicit Rex UI colors.
[theme]
name = "terminal"
auto_switch = true
dark_name = "terminal"
light_name = "terminal"

[theme.custom.light]
accent = "#0969da"
panel_bg = "#ffffff"
sidebar_bg = "#eceef2"
active_row_bg = "#e6effc"
selection_bg = "#e6effc"
surface0 = "#fafbfc"
surface1 = "#e7e9eb"
surface_dim = "#f8f9fb"
overlay0 = "#878a8e"
overlay1 = "#696d71"
text = "#1f2328"
subtext0 = "#696d71"
mauve = "#8250df"
green = "#116329"
yellow = "#9d5c00"
red = "#cf222e"
blue = "#0969da"
teal = "#1b7c83"
peach = "#9d5c00"

[theme.custom.dark]
accent = "#2f81f7"
panel_bg = "#0d1117"
sidebar_bg = "#131519"
active_row_bg = "#142134"
selection_bg = "#142134"
surface0 = "#1e2023"
surface1 = "#2e3135"
surface_dim = "#0f1319"
overlay0 = "#666a6f"
overlay1 = "#82878c"
text = "#e6edf3"
subtext0 = "#82878c"
mauve = "#bc8cff"
green = "#3fb950"
yellow = "#d29922"
red = "#ff7b72"
blue = "#58a6ff"
teal = "#39c5cf"
peach = "#d29922"

[update]
channel = "stable"

[keys]
# Command prefix: C-x
prefix = "ctrl+x"

help = "prefix+?"
# Keep prefix+s available for workspace selection.
settings = "prefix+shift+s"
detach = ["prefix+d", "prefix+q"]
reload_config = "prefix+r"
goto = "prefix+g"

# Workspace navigation:
#   prefix+s       choose workspace
#   prefix+w       also open workspace navigation (Herdr default muscle memory)
#   prefix+shift+w rename session/workspace (avoids symbol-layer gymnastics)
#   prefix+( / )   previous / next session/workspace
workspace_picker = ["prefix+s", "prefix+w"]
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
previous_workspace = "prefix+("
next_workspace = "prefix+)"

# agents
focus_agent = "prefix+alt+1..9"


# Tab management.
new_tab = "prefix+c"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
rename_tab = "prefix+comma"
close_tab = "prefix+shift+x"

# Pane creation:
#   prefix+\     split right
#   prefix+Enter split down
split_vertical = "prefix+backslash"
split_horizontal = "prefix+enter"
close_pane = "prefix+x"
zoom = "prefix+m"
copy_mode = "prefix+v"

resize_mode = "prefix+shift+r"

# Pane navigation. Ctrl+h/j/k/l are direct Herdr chords.
focus_pane_left = ["ctrl+h"]
focus_pane_down = ["ctrl+j"]
focus_pane_up = ["ctrl+k"]
focus_pane_right = ["ctrl+l"]
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"

# Keep Herdr's dashboard/sidebar available, but not on prefix+b since C-b is not the prefix here.
toggle_sidebar = "prefix+b"

# Navigate-mode movement.
navigate_workspace_up = "up"
navigate_workspace_down = "down"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

[ui]
sidebar_width = 32
sidebar_min_width = 18
sidebar_max_width = 36
# Ctrl+click on links double-opens (herdr + ghostty both fire); use shift+ctrl+click
# for the terminal-native bypass so only ghostty opens the link.
mouse_capture = true
right_click_passthrough_modifier = "ctrl"
mouse_scroll_lines = 3
confirm_close = false
prompt_new_tab_name = true

agent_panel_sort = "spaces"
[ui.toast]
delivery = "off"
delay_seconds = 1

[ui.toast.herdr]
position = "top-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
enabled = false

[session]
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[experimental]
# Persist recent pane output to disk. It can include secrets.
pane_history = true
allow_nested = false
kitty_graphics = true

# Keep disabled: macOS registers the Herdr client as Ghostty, adding a Dock icon.
# Automatic input-source switching is the suspected trigger.
switch_ascii_input_source_in_prefix = false
[advanced]
scrollback_limit_bytes = 52428800
