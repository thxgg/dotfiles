palette = "merino_light"
add_newline = false
command_timeout = 2000

[gcloud]
disabled = true

[nodejs]
detect_extensions = []
detect_files = ["package.json", ".node-version", ".nvmrc", ".tool-versions"]
detect_folders = ["node_modules"]

[directory]
style = "fg:accent"
truncation_symbol = ""
read_only_style = "fg:red"

[git_branch]
style = "fg:accent"

[git_status]
style = "fg:red"

[character]
success_symbol = "[❯](fg:accent)"
error_symbol = "[❯](fg:red)"
vimcmd_symbol = "[❮](fg:accent)"

[palettes.merino_light]
accent = "#0969da"
red = "#cf222e"
green = "#116329"
yellow = "#9d5c00"
blue = "#0969da"
purple = "#8250df"
cyan = "#1b7c83"
text = "#1f2328"
background = "#ffffff"
