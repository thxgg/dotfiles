palette = "merino_dark"
add_newline = false
command_timeout = 2000

[gcloud]
disabled = true

[nodejs]
detect_extensions = []
detect_files = ["package.json", ".node-version", ".nvmrc", ".tool-versions"]
detect_folders = ["node_modules"]

[directory]
style = "fg:accent"
truncation_symbol = ""
read_only_style = "fg:red"

[git_branch]
style = "fg:accent"

[git_status]
style = "fg:red"

[character]
success_symbol = "[❯](fg:accent)"
error_symbol = "[❯](fg:red)"
vimcmd_symbol = "[❮](fg:accent)"

[palettes.merino_dark]
accent = "#2f81f7"
red = "#ff7b72"
green = "#3fb950"
yellow = "#d29922"
blue = "#58a6ff"
purple = "#bc8cff"
cyan = "#39c5cf"
text = "#e6edf3"
background = "#0d1117"
